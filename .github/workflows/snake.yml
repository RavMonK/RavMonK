name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"   # daily 07:00 Bangkok
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#00b8d4&color_dots=#ebedf0,#b2f5ff,#5ee0ff,#00b8d4,#006978
            dist/github-snake-dark.svg?color_snake=#ff2bd6&color_dots=#0b0f14,#0f3a4a,#00788f,#00bcd4,#00e5ff
            dist/github-snake.gif?color_snake=#ff2bd6&color_dots=#0b0f14,#0f3a4a,#00788f,#00bcd4,#00e5ff

      - name: Publish to `output` branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
