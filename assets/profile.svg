<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="386" viewBox="0 0 1200 386" role="img" aria-label="~/.profile — zsh">
  <rect x="1" y="1" width="1198" height="384" rx="12" fill="#0B1118" stroke="#1A2733"/>
  <path d="M1 13 a12 12 0 0 1 12 -12 H1187 a12 12 0 0 1 12 12 V44 H1 Z" fill="#0E1620"/>
  <line x1="1" y1="44" x2="1199" y2="44" stroke="#1A2733"/>
  <circle cx="28" cy="23" r="6" fill="#FF5F57"/><circle cx="48" cy="23" r="6" fill="#FEBC2E"/><circle cx="68" cy="23" r="6" fill="#28C840"/>
  <text x="600" y="28" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="13" fill="#8B9AAA">~/.profile — zsh</text>
  <g font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-size="16">
    <text x="36" y="76" fill="#8B9AAA"><tspan fill="#00E5FF">$</tspan> cat ~/.profile</text>
    <text x="36" y="104" fill="#8B9AAA">{</text><text x="36" y="132"><tspan fill="#9BE8FF" dx="20">alias</tspan><tspan fill="#8B9AAA">: </tspan><tspan fill="#00E5FF">"RavMonK"</tspan><tspan fill="#8B9AAA">,</tspan></text><text x="36" y="160"><tspan fill="#9BE8FF" dx="20">interests</tspan><tspan fill="#8B9AAA">: </tspan><tspan fill="#8B9AAA">[<tspan fill="#00E5FF">"agentic AI"</tspan>, <tspan fill="#00E5FF">"reverse engineering"</tspan>, <tspan fill="#00E5FF">"security tooling"</tspan>, <tspan fill="#00E5FF">"automation"</tspan>, <tspan fill="#00E5FF">"home-lab"</tspan>]</tspan><tspan fill="#8B9AAA">,</tspan></text><text x="36" y="188"><tspan fill="#9BE8FF" dx="20">daily</tspan><tspan fill="#8B9AAA">: </tspan><tspan fill="#8B9AAA">[<tspan fill="#00E5FF">"macOS"</tspan>, <tspan fill="#00E5FF">"Kali Linux"</tspan>, <tspan fill="#00E5FF">"Hermes Agent"</tspan>, <tspan fill="#00E5FF">"Ollama"</tspan>, <tspan fill="#00E5FF">"VMware"</tspan>]</tspan><tspan fill="#8B9AAA">,</tspan></text><text x="36" y="216"><tspan fill="#9BE8FF" dx="20">languages</tspan><tspan fill="#8B9AAA">: </tspan><tspan fill="#8B9AAA">[<tspan fill="#00E5FF">"Python"</tspan>, <tspan fill="#00E5FF">"TypeScript"</tspan>, <tspan fill="#00E5FF">"C#"</tspan>, <tspan fill="#00E5FF">"Bash"</tspan>, <tspan fill="#00E5FF">"PowerShell"</tspan>]</tspan><tspan fill="#8B9AAA">,</tspan></text><text x="36" y="244"><tspan fill="#9BE8FF" dx="20">motto</tspan><tspan fill="#8B9AAA">: </tspan><tspan fill="#00E5FF">"If I have to do it twice, it becomes a script."</tspan><tspan fill="#8B9AAA">,</tspan></text><text x="36" y="272"><tspan fill="#9BE8FF" dx="20">status</tspan><tspan fill="#8B9AAA">: </tspan><tspan fill="#00E5FF">"shipping small tools that save big time"</tspan><tspan fill="#8B9AAA"></tspan></text><text x="36" y="300" fill="#8B9AAA">}</text><text x="36" y="334" fill="#8B9AAA"><tspan fill="#FF2BD6">#</tspan> hooded android at a keyboard, apparently</text><text x="36" y="362" fill="#8B9AAA"><tspan fill="#00E5FF">$</tspan> _<animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" calcMode="discrete"/></text>
  </g>
</svg>